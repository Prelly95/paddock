[package]
name    = "rover-gcs-sim"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sim"
path = "src/main.rs"

[dependencies]
tokio            = { version = "1",    features = ["full"] }
tokio-tungstenite = "0.24"
futures-util     = "0.3"
serde            = { version = "1",    features = ["derive"] }
serde_json       = "1"
